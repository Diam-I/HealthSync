name: Flutter CI/CD

on:
  push:
    branches: ["main","develop"]
  pull_request:
    branches: ["main","develop"]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Cloner le projet
        uses: actions/checkout@v3

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recuperer les dépendances
        run: flutter pub get

      - name: Analyser le code
        run: flutter analyze

      - name: Executer les tests
        run: flutter test

      - name: Construire l'APK
        run: flutter build apk --release
        
      - name: Sauvegarder l'APK 
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: healthsync/build/app/outputs/flutter-apk/app-release.apk

      
